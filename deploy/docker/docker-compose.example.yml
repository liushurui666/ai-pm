services:
  ai-pm:
    # 本 compose 文件面向单机部署：服务器直接从公开仓库拉代码，然后本地构建镜像。
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ai-pm:latest
    container_name: ai-pm
    restart: unless-stopped
    env_file:
      # CI/CD 通常会在仓库根目录生成 .env；env_file 路径相对 compose 文件所在目录，
      # 因此默认使用 ../../.env。传统单机部署仍可用 AI_PM_ENV_FILE=/etc/ai-pm/ai-pm.env 覆盖。
      - ${AI_PM_ENV_FILE:-../../.env}
    environment:
      NODE_ENV: production
      PORT: "3003"
      RUN_MIGRATIONS: "1"
    ports:
      - "3003:3003"
