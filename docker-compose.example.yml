services:
  ai-pm:
    # 本 compose 文件面向单机部署：服务器直接从公开仓库拉代码，然后本地构建镜像。
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-pm:latest
    container_name: ai-pm
    restart: unless-stopped
    env_file:
      - /etc/ai-pm/ai-pm.env
    environment:
      NODE_ENV: production
      PORT: "3003"
      RUN_MIGRATIONS: "1"
    ports:
      - "3003:3003"
